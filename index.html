<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyDub AI - Dublagem Grátis Universal</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #334155;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        main {
            max-width: 1200px;
            margin: 100px auto 40px auto;
            padding: 0 2rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .dubber-box {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            transition: all 0.4s ease;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
        }

        .drop-zone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-dark);
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .yoyle-mode {
            border-color: #a855f7 !important;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            background-color: #2e1065;
        }

        .output-panel {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">⚡ PolyDub AI</div>
            <span style="color: var(--text-muted); font-size: 0.9rem;">100% Grátis - Sem Aluguel</span>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Dublagem Grátis de Filmes, Episódios e Curtas</h1>
            <p>Dubles suas produções favoritas em todos os idiomas com clonagem de voz por IA (Voice Cloner).</p>
        </div>

        <section class="dubber-box" id="mainBox">
            <div class="grid-inputs">
                <div class="form-group">
                    <label>1. Envie seu Vídeo ou Áudio (Filmes, Séries, Curtas)</label>
                    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                        <span style="font-size: 2.5rem; display:block; margin-bottom: 0.5rem;">🎬</span>
                        <p>Clique ou arraste o seu arquivo aqui</p>
                        <input type="file" id="fileInput" style="display: none;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="languageSelect">2. Escolha o Idioma da Dublagem</label>
                    <select id="languageSelect" onchange="mudarIdioma(this.value)">
                        <option value="pt">Português</option>
                        <option value="en">Inglês</option>
                        <option value="es">Espanhol</option>
                        <option value="ja">Japonês</option>
                        <option value="yoyle">Yoylese (BFDI Accent) ✨</option>
                    </select>

                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" id="voiceCloner" checked>
                            <span>Ativar <b>AI Dubbing Voice Cloner</b> (Clonagem de voz grátis)</span>
                        </label>
                    </div>
                </div>
            </div>

            <button class="btn-submit" onclick="gerarDublagem()">Iniciar Dublagem Gratuita</button>

            <div class="output-panel" id="outputPanel">
                <h3 style="color: #10b981; margin-bottom: 0.5rem;">✓ Processamento Concluído!</h3>
                <p id="outputMessage"></p>
            </div>
        </section>
    </main>

    <script>
        function mudarIdioma(valor) {
            const box = document.getElementById('mainBox');
            if(valor === 'yoyle') {
                box.classList.add('yoyle-mode');
                alert("Yoylecake! Sotaque Yoylese de BFDI ativado com a sua pronúncia metálica!");
            } else {
                box.classList.remove('yoyle-mode');
            }
        }

        function gerarDublagem() {
            const select = document.getElementById('languageSelect');
            const idioma = select.options[select.selectedIndex].text;
            const painel = document.getElementById('outputPanel');
            const mensagem = document.getElementById('outputMessage');

            painel.style.display = "block";
            
            if(select.value === 'yoyle') {
                mensagem.innerHTML = `🎙️ Vídeo dublado com sucesso para o idioma <b>${idioma}</b>! Clonador de voz ativado usando os fonemas clássicos e sotaque de Yoyleland.`;
            } else {
                mensagem.innerHTML = `🎬 Seu arquivo foi totalmente dublado para o idioma <b>${idioma}</b> usando IA com clonagem de voz idêntica ao ator original.`;
            }
        }
    </script>
</body>
</html>
